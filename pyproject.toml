[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragengine"
version = "0.1.0"
description = "A modular, local-first Retrieval-Augmented Generation (RAG) engine with an optional agentic retrieval mode."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "langchain-core>=0.2",
    "langchain-text-splitters>=0.2",
    "pypdf>=4.2",
    "pymupdf>=1.24",
    "docx2txt>=0.8",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "requests>=2.31",
    "chromadb>=0.5",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Real local models. Not installed by default because they pull in torch
# and require downloading model weights from huggingface.co at runtime.
local-models = [
    "sentence-transformers>=3.0",
    "transformers>=4.42",
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
